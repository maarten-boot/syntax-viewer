[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syntax-viewer"
version = "0.1.0"
description = "Browse grammars (Lark, EBNF, Lemon, Yacc, Bison) as hyperlinked rules"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8", "lark>=1.1", "ruff"]  # lark: cross-check of the Lark reader only

[project.scripts]
syntax-viewer = "syntax_viewer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
